version: "3.8"

services:
  notice-board:
    build:
      context: .
      dockerfile: Dockerfile
    image: notice-board-app:latest
    container_name: notice-board-container
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
